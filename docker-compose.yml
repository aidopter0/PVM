services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pvm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pvm}
      POSTGRES_DB: ${POSTGRES_DB:-pvm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Published on localhost only, so `npm run dev` / `npm start` can use this database too.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pvm}:${POSTGRES_PASSWORD:-pvm}@db:5432/${POSTGRES_DB:-pvm}
      SEED_DEMO: ${SEED_DEMO:-false}
    ports:
      - '${WEB_PORT:-8080}:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
